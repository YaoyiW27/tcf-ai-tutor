# TCF tutor backend on Fly. Deploy after the gateway — GATEWAY_URL points at it
# over Fly's private network, and boot-time rubric seeding embeds through it.
#
#   fly launch --no-deploy --copy-config --name tcf-backend
#   fly secrets set DATABASE_URL=... API_KEY=... OPENAI_API_KEY=...
#   fly deploy
#
# DATABASE_URL is the Neon string with two edits: the driver must be
# postgresql+asyncpg://, and Neon's ?sslmode=require must become ?ssl=require —
# asyncpg does not understand libpq's sslmode and will refuse to connect.

app = "tcf-backend"
primary_region = "sjc"   # San Jose — sea (Seattle) is deprecated and
                         # refuses new machines; sjc is the closest remaining
                         # region to both Vancouver and Neon in us-west-2

[build]
  dockerfile = "Dockerfile"

[env]
  # .flycast, not .internal. The gateway holds the Anthropic key and has no auth
  # of its own, so it gets no public IP — but .internal resolves straight to the
  # machine and bypasses Fly's proxy, which is what implements auto-start. A
  # stopped gateway would then simply refuse the connection. A private ingress
  # address (fly ips allocate-v6 --private) routes through the proxy instead, so
  # the gateway stays off the public internet and still wakes on demand.
  # Port 80, not 8001: Fly's proxy listens on the service port and forwards to
  # the container's internal_port. Connecting to :8001 through flycast reaches
  # no listener and the proxy resets it.
  GATEWAY_URL = "http://tcf-gateway.flycast"
  INFERENCE_MODEL = "claude-sonnet-4-6"
  # The browser never calls this directly — the frontend proxies server-side —
  # so no deployed origin belongs here.
  CORS_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Boot runs migrations plus two seed scripts before uvicorn binds, so the
    # first check has to wait longer than a plain web app would.
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Grading holds a request for ~20s while several model calls run; memory
  # rather than CPU is the constraint, and 512mb has been enough locally.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
