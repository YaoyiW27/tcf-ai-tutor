# Lightweight kube-prometheus-stack for kind: just what we need to scrape the
# gateway and view the dashboard. Install:
#   helm install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f kube-prometheus-stack.values.yaml

# Trim components we don't need for this demo (lighter on a single kind node).
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
defaultRules:
  create: false

prometheus:
  prometheusSpec:
    # Select ServiceMonitors/PodMonitors from any namespace without requiring a
    # release label — so our chart's ServiceMonitor is picked up.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

grafana:
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true
      # Import dashboard ConfigMaps (label grafana_dashboard=1) from any namespace.
      searchNamespace: ALL
