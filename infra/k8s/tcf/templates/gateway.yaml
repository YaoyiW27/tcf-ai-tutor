apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tcf.fullname" . }}-gateway
  labels:
    {{- include "tcf.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "tcf.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tcf.selectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          env:
            - name: INFERENCE_BACKEND
              value: {{ .Values.gateway.inferenceBackend | quote }}
            {{- if .Values.gateway.upstreamBaseUrl }}
            - name: UPSTREAM_BASE_URL
              value: {{ .Values.gateway.upstreamBaseUrl | quote }}
            {{- end }}
            - name: RATE_LIMIT_PER_MIN
              value: {{ .Values.gateway.rateLimitPerMin | quote }}
            - name: RATE_LIMIT_BURST
              value: {{ .Values.gateway.rateLimitBurst | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcf.secretName" . }}
                  key: ANTHROPIC_API_KEY
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tcf.fullname" . }}-gateway
  labels:
    {{- include "tcf.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    {{- include "tcf.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8001
      targetPort: http
