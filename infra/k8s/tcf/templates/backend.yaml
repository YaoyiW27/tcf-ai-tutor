apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tcf.fullname" . }}-backend
  labels:
    {{- include "tcf.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "tcf.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tcf.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      # Migrate + seed before the app starts. Idempotent, and K8s retries the
      # initContainer until Postgres is reachable — so no Helm hook ordering
      # against the Postgres Deployment. (A dedicated one-time Job is a future
      # refinement; per-replica re-runs are safe because both steps are idempotent.)
      initContainers:
        - name: migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_questions"]
          envFrom:
            - secretRef:
                name: {{ include "tcf.secretName" . }}
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - secretRef:
                name: {{ include "tcf.secretName" . }}
          env:
            - name: GATEWAY_URL
              value: "http://{{ include "tcf.fullname" . }}-gateway:8001"
            - name: INFERENCE_MODEL
              value: {{ .Values.backend.inferenceModel | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tcf.fullname" . }}-backend
  labels:
    {{- include "tcf.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "tcf.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
