{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tcf.fullname" . }}-gateway
  labels:
    {{- include "tcf.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "tcf.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      # Tag every gateway series with impl=python so the dashboard/HPA can A/B
      # against a future implementation.
      relabelings:
        - targetLabel: impl
          replacement: python
          action: replace
{{- end }}
