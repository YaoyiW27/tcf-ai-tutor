apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tcf.secretName" . }}
  labels:
    {{- include "tcf.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  # Fully-formed async DSN so backend init + app containers just consume it.
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.secrets.postgresPassword (include "tcf.fullname" .) .Values.postgres.db | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
  LANGFUSE_HOST: {{ .Values.secrets.langfuseHost | quote }}
