# Copy to values-secret.yaml (gitignored) and fill in, then:
#   helm install tcf infra/k8s/tcf -n tcf --create-namespace -f infra/k8s/tcf/values-secret.yaml
secrets:
  # Used by the gateway for text LLM calls (required to grade).
  anthropicApiKey: "sk-ant-CHANGE_ME"
  # Backend Whisper STT / TTS (speaking path). Optional for writing grading.
