# Scrapes the gateway's /metrics. The `impl` target label is attached to every
# series from that target, so dashboards can A/B by implementation without any
# app-side label. Add the Rust gateway as a second target when it exists.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          impl: python
      # Uncomment when the Rust gateway is running (see docs/rust-gateway-benchmark.md):
      # - targets: ["host.docker.internal:8002"]
      #   labels:
      #     impl: rust

  # vLLM serving metrics (feeds the "vLLM Serving" dashboard). Set the target to
  # your rented vLLM endpoint host:port, then restart prometheus. See
  # docs/vllm-runbook.md. vLLM's /metrics is unauthenticated by default.
  # - job_name: vllm
  #   metrics_path: /metrics
  #   scheme: https                                    # RunPod public proxy (443); omit for a host:port target
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]       # or the public vLLM host (e.g. <id>-8000.proxy.runpod.net)
