# Prometheus + Grafana for the inference gateway.
# The gateway runs on the host (uvicorn :8001); Prometheus scrapes it via
# host.docker.internal. Grafana is on :3001 to avoid the frontend's :3000.
#
#   docker compose -f infra/observability/docker-compose.yml up -d
#   Prometheus → http://localhost:9090   Grafana → http://localhost:3001
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tcf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tcf-grafana
    ports:
      - "3001:3000"
    environment:
      # Local-only: anonymous access, no login, so dashboards just load.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
